name: sentinel

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sentinel
  cancel-in-progress: false

jobs:
  probe-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run sentinel checks
        id: checks
        run: node scripts/check.mjs

      - name: Persist history
        run: |
          git config user.name "jiaozi-sentinel"
          git config user.email "sentinel@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "sentinel: $(date -u +%FT%TZ)"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment

      - name: Alert on failing monitors
        if: steps.checks.outputs.alerts != '0'
        run: |
          echo "::error::${{ steps.checks.outputs.alerts }} monitor(s) down — see site/status.json"
          exit 1
